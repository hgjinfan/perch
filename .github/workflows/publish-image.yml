name: Publish container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v0.1.6
        required: true
        default: v0.1.6

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

      - name: Build and publish image
        env:
          IMAGE: ghcr.io/hgjinfan/perch
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $VERSION" >&2
            exit 1
          fi
          set -- --tag "$IMAGE:$VERSION"
          if [[ "$VERSION" != *-* ]]; then
            set -- "$@" --tag "$IMAGE:latest"
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label org.opencontainers.image.source=https://github.com/hgjinfan/perch \
            "$@" \
            --push .
